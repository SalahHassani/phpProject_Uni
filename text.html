<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style2.css" />
  </head>
  <body>
    <div class="pokemonDetails modal">
      <div class="pokemonName">
        <h1><span class="highlight">Pikachu</span></h1>
      </div>
      <div class="details">
        <div class="pokemonImage col-5 electric">
          <img
            src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png"
            alt=""
          />
        </div>
        <div class="extraDetails col-7">
          <div class="description">
            <h2>Description</h2>
            <p>buhot hi mahnathi hain</p>
          </div>
          <div class="type">
            <h2>Type :</h2>
            <div>
              <img src="./images/electric.png" alt="" />
              <h3>Electric</h3>
            </div>
          </div>
          <div class="status">
            <h2>Status</h2>
            <div>
              <div class="health col-4">
                <h3>Health : 60</h3>
                <img src="./images/health.png" alt="no image found" />
              </div>
              <div class="defence col-4">
                <h3>Defence : 60</h3>
                <img src="./images/defance.png" alt="no image found" />
              </div>
              <div class="Attack col-4">
                <h3>Attack : 60</h3>
                <img src="./images/attack.png" alt="no image found" />
              </div>
            </div>
          </div>
          <div class="price">
            <img src="./images/moneyBag.png" alt="no image found" />
            <h2>160 USD</h2>
          </div>
        </div>
      </div>
      <div class="trade">
        <div class="isAvailable">
          <h1>Open to Trade</h1>
        </div>
        <div id="container2">
          <div class="currentOnwer col-6">
            <div class="nameAndPic">
              <span class="profileIcon col-4">
                <img
                  src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png"
                  alt=""
                />
              </span>
              <h3 class="col-7">Admin</h3>
            </div>
            <div class="lastBought">
              <span>Bought Date : </span> 20-jan-2022
            </div>
            <div class="lastBoughtPrice">
              <span>Bought Price : </span>160 USD
            </div>
            <div class="lastCardOnwer"><span>Last Owner : </span> None</div>
            <div class="rating"><span>Rating.... </span> 5 Star</div>
          </div>

          <div class="offer col-6">
            <div class="btn">
              <button><i class="fa-solid fa-percent"></i> Send an Offer</button>
              <button>
                <i class="fa-brands fa-nfc-symbol"></i> Send a Request
              </button>
            </div>
            <!-- <div class="btn"></div> -->
            <div class="btn">
              <!-- <button class="btn"> -->
              <button>
                <i class="fa-solid fa-retweet"></i> Ask to Swap Cards
              </button>
            </div>
            <!-- i: offer..... ii: request..... iii: swap cards -->
          </div>

          <!-- <div class="pricingDetails col-4">
            expected price.... trande.... last owner....
          </div> -->
        </div>
      </div>
    </div>
  </body>
</html>
